<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Event Registration Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #1e293b, #2563eb);
            color: white;
            padding: 55px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 38px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        header p {
            font-size: 17px;
            color: #dbeafe;
        }

        /* Main container */
        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .section-title h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .section-title p {
            color: #64748b;
        }

        /* Events grid */
        #events {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        /* Event card */
        .event {
            background: white;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .event:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.14);
        }

        .event h2 {
            font-size: 22px;
            color: #1e293b;
            margin-bottom: 12px;
        }

        .description {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .event-info {
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
            margin-top: 15px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .info-label {
            font-weight: bold;
            color: #475569;
        }

        .info-value {
            color: #64748b;
            text-align: right;
        }

        /* Seat badge */
        .seats {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            background: #dcfce7;
            color: #166534;
            font-size: 13px;
            font-weight: bold;
        }

        /* Register button */
        button {
            width: 100%;
            padding: 13px 20px;
            margin-top: 12px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading */
        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: #64748b;
            font-size: 18px;
        }

        /* Empty state */
        .empty {
            grid-column: 1 / -1;
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 12px;
            color: #64748b;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            animation: slideIn 0.25s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            font-size: 24px;
        }

        .close {
            font-size: 28px;
            cursor: pointer;
            color: #64748b;
        }

        .close:hover {
            color: #ef4444;
        }

        /* Form */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #334155;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .submit-btn {
            margin-top: 5px;
        }

        /* Footer */
        footer {
            margin-top: 60px;
            background: #1e293b;
            color: #cbd5e1;
            text-align: center;
            padding: 25px;
            font-size: 14px;
        }

        /* Mobile */
        @media (max-width: 600px) {

            header {
                padding: 40px 15px;
            }

            header h1 {
                font-size: 28px;
            }

            .container {
                width: 92%;
            }

            .event {
                padding: 20px;
            }

            .modal-content {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🎓 College Event Portal</h1>
    <p>Discover events, workshops and activities happening at your college</p>
</header>


<div class="container">

    <div class="section-title">
        <h2>Upcoming Events</h2>
        <p>Register for your favorite college events</p>
    </div>

    <div id="events">
        <div class="loading">
            Loading events...
        </div>
    </div>

</div>


<!-- Registration Modal -->

<div id="registrationModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Event Registration</h2>

            <span class="close" onclick="closeModal()">
                &times;
            </span>

        </div>

        <form id="registrationForm">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="college">
                    College
                </label>

                <input
                    type="text"
                    id="college"
                    placeholder="Enter your college"
                    required
                >

            </div>


            <div class="form-group">

                <label for="department">
                    Department
                </label>

                <input
                    type="text"
                    id="department"
                    placeholder="e.g. Computer Science"
                    required
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >

            </div>


            <button
                type="submit"
                class="submit-btn"
            >
                Complete Registration
            </button>

        </form>

    </div>

</div>


<footer>
    © 2026 College Event Registration Portal
</footer>


<script>

const API_URL = "/api";

let selectedEventId = null;


/* =========================
   LOAD EVENTS
========================= */

async function loadEvents() {

    const container = document.getElementById("events");

    try {

        const response = await fetch(`${API_URL}/events`);

        if (!response.ok) {
            throw new Error("Failed to load events");
        }

        const events = await response.json();

        container.innerHTML = "";

        if (!events || events.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    <h3>No upcoming events</h3>
                    <p>There are currently no events available for registration.</p>
                </div>
            `;

            return;
        }


        events.forEach(event => {

            const seats = Number(event.available_seats);

            const isFull = seats <= 0;

            container.innerHTML += `

                <div class="event">

                    <h2>
                        ${event.title}
                    </h2>

                    <p class="description">
                        ${event.description || "No description available."}
                    </p>


                    <div class="event-info">

                        <div class="info-row">

                            <span class="info-label">
                                📅 Date
                            </span>

                            <span class="info-value">
                                ${event.event_date}
                            </span>

                        </div>


                        <div class="info-row">

                            <span class="info-label">
                                📍 Venue
                            </span>

                            <span class="info-value">
                                ${event.venue || "TBA"}
                            </span>

                        </div>


                        <div class="info-row">

                            <span class="info-label">
                                🎟️ Seats
                            </span>

                            <span class="seats">
                                ${seats} available
                            </span>

                        </div>

                    </div>


                    <button
                        ${isFull ? "disabled" : ""}
                        onclick="openRegistration(${event.id})"
                    >

                        ${isFull ? "Event Full" : "Register Now"}

                    </button>

                </div>

            `;

        });

    } catch (error) {

        console.error(error);

        container.innerHTML = `

            <div class="empty">

                <h3>Unable to load events</h3>

                <p>
                    Please check the backend service and try again.
                </p>

                <button onclick="loadEvents()">
                    Try Again
                </button>

            </div>

        `;

    }

}


/* =========================
   OPEN REGISTRATION
========================= */

function openRegistration(eventId) {

    selectedEventId = eventId;

    document.getElementById("registrationModal").style.display = "flex";

}


/* =========================
   CLOSE REGISTRATION
========================= */

function closeModal() {

    document.getElementById("registrationModal").style.display = "none";

    document.getElementById("registrationForm").reset();

    selectedEventId = null;

}


/* =========================
   REGISTER
========================= */

document
    .getElementById("registrationForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const name =
            document.getElementById("name").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const college =
            document.getElementById("college").value.trim();

        const department =
            document.getElementById("department").value.trim();

        const phone =
            document.getElementById("phone").value.trim();


        const submitButton =
            document.querySelector(".submit-btn");

        submitButton.disabled = true;

        submitButton.textContent =
            "Registering...";


        try {

            const response = await fetch(
                `${API_URL}/register`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        event_id: selectedEventId,

                        student_name: name,

                        email: email,

                        college: college,

                        department: department,

                        phone: phone

                    })
                }
            );


            const result = await response.json();


            if (!response.ok) {

                throw new Error(
                    result.error ||
                    "Registration failed"
                );

            }


            alert(
                result.message ||
                "Registration successful!"
            );


            closeModal();

            loadEvents();


        } catch (error) {

            alert(error.message);

        } finally {

            submitButton.disabled = false;

            submitButton.textContent =
                "Complete Registration";

        }

    });


/* =========================
   CLOSE MODAL ON OUTSIDE CLICK
========================= */

window.addEventListener("click", function(event) {

    const modal =
        document.getElementById("registrationModal");

    if (event.target === modal) {

        closeModal();

    }

});


/* =========================
   INITIAL LOAD
========================= */

loadEvents();

</script>

</body>

</html>
