<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register for Event</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header><nav class="navbar"><div class="logo">College Event Portal</div><ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="events.html">Events</a></li><li><a href="register.html">Register</a></li><li><a href="admin.html">Admin</a></li></ul></nav></header>
<main class="form-container"><div class="form-card"><h1>Event Registration</h1><p>Fill in your details to register for an event.</p>
<form id="registration-form"><div class="form-group"><label for="name">Full Name</label><input type="text" id="name" name="name" placeholder="Enter your full name" required></div>
<div class="form-group"><label for="email">Email Address</label><input type="email" id="email" name="email" placeholder="Enter your email" required></div>
<div class="form-group"><label for="event">Select Event</label><select id="event" name="event" required><option value="">Loading events...</option></select></div>
<button type="submit" class="btn submit-btn">Register</button></form>
<div id="success-message" class="success-message"></div><div id="error-message" class="error-message"></div></div></main>
<footer><p>© 2026 College Event Portal</p></footer><script src="js/register.js"></script>
</body></html>
