services:

  database:

    image: mysql:8.0



    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: college_event_db

    ports:
      - "127.0.0.1:3306:3306"  

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - college-network


  backend:

    build:
      context: ./backend

    container_name: college-backend

    environment:
      DB_HOST: database
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: college_event_db

    depends_on:
      - database

    networks:
      - college-network


  frontend:

    build:
      context: ./frontend

    container_name: college-frontend

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - college-network


volumes:

  mysql_data:


networks:

  college-network:
