name: Deploy College Event Portal

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------
      # 1. Checkout
      # --------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------
      # 2. Configure AWS using OIDC
      # --------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------
      # 3. Setup Terraform
      # --------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # --------------------------------
      # 4. Terraform Init
      # --------------------------------

      - name: Terraform Init
        working-directory: terraform
        run: terraform init


      # --------------------------------
      # 5. Terraform Validate
      # --------------------------------

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate


      # --------------------------------
      # 6. Bootstrap infrastructure
      #
      # Creates:
      # S3
      # DynamoDB
      # ECR
      # IAM
      # --------------------------------

      - name: Terraform Bootstrap
        working-directory: terraform
        run: |
          terraform apply \
            -auto-approve \
            -var="admin_token=${{ secrets.ADMIN_TOKEN }}" \
            -var="enable_lambda=false"


      # --------------------------------
      # 7. Get ECR repository
      # --------------------------------

      - name: Get ECR repository
        id: ecr
        working-directory: terraform
        run: |
          echo "repository=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"


      # --------------------------------
      # 8. Login to ECR
      # --------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------
      # 9. Build Docker image
      # --------------------------------

      - name: Build Docker image
        working-directory: backend
        run: |
          docker build \
            -t ${{ steps.ecr.outputs.repository }}:${{ github.sha }} \
            -t ${{ steps.ecr.outputs.repository }}:latest \
            .


      # --------------------------------
      # 10. Push Docker image
      # --------------------------------

      - name: Push Docker image
        run: |
          docker push ${{ steps.ecr.outputs.repository }}:${{ github.sha }}
          docker push ${{ steps.ecr.outputs.repository }}:latest


      # --------------------------------
      # 11. Create/update Lambda
      # --------------------------------

      - name: Deploy Lambda
        working-directory: terraform
        run: |
          terraform apply \
            -auto-approve \
            -var="admin_token=${{ secrets.ADMIN_TOKEN }}" \
            -var="enable_lambda=true"


      # --------------------------------
      # 12. Get API URL
      # --------------------------------

      - name: Get Lambda API URL
        id: api
        working-directory: terraform
        run: |
          echo "url=$(terraform output -raw lambda_function_url)" >> "$GITHUB_OUTPUT"


      # --------------------------------
      # 13. Update frontend API URL
      # --------------------------------

      - name: Configure frontend API URL
        run: |
          sed -i "s|__API_URL__|${{ steps.api.outputs.url }}|g" frontend/js/config.js


      # --------------------------------
      # 14. Get S3 bucket
      # --------------------------------

      - name: Get S3 bucket
        id: s3
        working-directory: terraform
        run: |
          echo "bucket=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_OUTPUT"


      # --------------------------------
      # 15. Upload frontend
      # --------------------------------

      - name: Deploy frontend to S3
        run: |
          aws s3 sync frontend/ \
            s3://${{ steps.s3.outputs.bucket }}/ \
            --delete


      # --------------------------------
      # 16. Show deployment information
      # --------------------------------

      - name: Deployment information
        working-directory: terraform
        run: |
          echo "===================================="
          echo "Deployment completed"
          echo "===================================="

          echo "Website:"
          terraform output -raw s3_website_endpoint

          echo ""

          echo "API:"
          terraform output -raw lambda_function_url
